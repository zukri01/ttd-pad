<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tanda tangan</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
html,body{margin:0;background:#fff;color:#111;font:16px system-ui,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;align-items:center;padding:12px;box-sizing:border-box;min-height:100vh}
p{margin:.2rem 0 .6rem}
#pad{border:2px solid #222;border-radius:8px;background:#fff;touch-action:none;display:block}
#tools{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:12px;flex-wrap:wrap}
#mini{width:100px;height:100px;border:1px solid #bbb;background:#fff}
label{font-size:14px}
#row{display:flex;gap:12px;margin-top:12px}
button{font:inherit;font-weight:600;padding:.7rem 1.6rem;border-radius:8px;border:1px solid #222;background:#fff;color:#111}
#ok{background:#111;color:#fff}
#msg{min-height:1.4rem;margin-top:10px;color:#b91c1c;text-align:center}
</style>
</head>
<body>
<p>Tanda tangan di kotak ini</p>
<canvas id="pad"></canvas>
<div id="tools"><label>Ketebalan: <b id="tv">2</b> px<br><input id="th" type="range" min="1" max="8" step="1" value="2"></label><canvas id="mini" aria-label="Pratinjau hasil 100x100"></canvas></div>
<label><input id="np" type="checkbox"> Abaikan sentuhan saat memakai pena</label>
<div id="row"><button id="clr" type="button">Hapus</button><button id="ok" type="button">Kirim</button></div>
<div id="msg" role="status" aria-live="polite"></div>
<script>
(function(){
var T=function(){return window.Telegram&&window.Telegram.WebApp};
var wa=T();
if(wa){try{if(wa.ready)wa.ready();if(wa.expand)wa.expand();if(wa.disableVerticalSwipes)wa.disableVerticalSwipes()}catch(e){}}
var cv=document.getElementById('pad'),ctx=cv.getContext('2d'),msg=document.getElementById('msg');
var th=document.getElementById('th'),tv=document.getElementById('tv'),np=document.getElementById('np'),mini=document.getElementById('mini'),mctx=mini.getContext('2d');
var dpr=window.devicePixelRatio||1,W=0,H=0,strokes=[],cur=null,curId=null,penSeen=false;
function say(t){msg.textContent=t||''}
function size(){
  var nw=Math.max(200,Math.min(window.innerWidth-28,600)),nh=Math.round(nw*2/3);
  if(W){var k=nw/W;strokes.forEach(function(s){s.forEach(function(p){p[0]*=k;p[1]*=k})})}
  W=nw;H=nh;cv.style.width=W+'px';cv.style.height=H+'px';cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);draw();
  mini.width=Math.round(100*dpr);mini.height=Math.round(100*dpr);mctx.setTransform(dpr,0,0,dpr,0,0);drawMini();
}
function drawMini(){ // persis hasil akhir 100x100: skala seragam, margin ~6 px, tengah, tebal t px
  var T=+th.value,x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  mctx.fillStyle='#fff';mctx.fillRect(0,0,100,100);
  strokes.forEach(function(s){s.forEach(function(p){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])})});
  if(x1<x0)return;
  var k=88/Math.max(x1-x0,y1-y0,1),ox=(100-(x1-x0)*k)/2-x0*k,oy=(100-(y1-y0)*k)/2-y0*k;
  mctx.strokeStyle='#000';mctx.fillStyle='#000';mctx.lineWidth=T;mctx.lineCap='round';mctx.lineJoin='round';
  strokes.forEach(function(s){
    if(s.length===1){mctx.beginPath();mctx.arc(s[0][0]*k+ox,s[0][1]*k+oy,T/2,0,6.2832);mctx.fill();return}
    mctx.beginPath();mctx.moveTo(s[0][0]*k+ox,s[0][1]*k+oy);
    for(var i=1;i<s.length;i++)mctx.lineTo(s[i][0]*k+ox,s[i][1]*k+oy);
    mctx.stroke();
  });
}
th.addEventListener('input',function(){tv.textContent=th.value;drawMini()});
function draw(){
  ctx.clearRect(0,0,W,H);ctx.strokeStyle='#000';ctx.fillStyle='#000';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';
  strokes.forEach(function(s){
    if(s.length===1){ctx.beginPath();ctx.arc(s[0][0],s[0][1],1.3,0,6.2832);ctx.fill();return}
    ctx.beginPath();ctx.moveTo(s[0][0],s[0][1]);
    for(var i=1;i<s.length-1;i++){ctx.quadraticCurveTo(s[i][0],s[i][1],(s[i][0]+s[i+1][0])/2,(s[i][1]+s[i+1][1])/2)}
    ctx.lineTo(s[s.length-1][0],s[s.length-1][1]);ctx.stroke();
  });
}
function pt(e){var r=cv.getBoundingClientRect();return [Math.min(W,Math.max(0,e.clientX-r.left-cv.clientLeft)),Math.min(H,Math.max(0,e.clientY-r.top-cv.clientTop))]}
cv.addEventListener('pointerdown',function(e){
  if(e.pointerType==='pen')penSeen=true;
  if(e.pointerType==='touch'&&penSeen&&np.checked)return; // telapak tangan (opsional)
  if(cur)return;
  try{cv.setPointerCapture(e.pointerId)}catch(x){}
  cur=[pt(e)];curId=e.pointerId;strokes.push(cur);say('');draw();e.preventDefault();
});
cv.addEventListener('pointermove',function(e){
  if(!cur||e.pointerId!==curId)return;
  var ev=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];if(!ev.length)ev=[e];
  ev.forEach(function(c){var p=pt(c),l=cur[cur.length-1];if(Math.abs(p[0]-l[0])+Math.abs(p[1]-l[1])>=1)cur.push(p)});
  draw();e.preventDefault();
});
function up(e){if(cur&&e.pointerId===curId){cur=null;curId=null;drawMini()}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
document.getElementById('clr').onclick=function(){strokes=[];cur=null;curId=null;say('');draw();drawMini()};
function rdp(p,eps){
  if(p.length<3)return p;
  var keep=new Uint8Array(p.length),st=[[0,p.length-1]];keep[0]=keep[p.length-1]=1;
  while(st.length){
    var a=st.pop(),i0=a[0],i1=a[1],dm=0,ix=-1,ax=p[i0][0],ay=p[i0][1],bx=p[i1][0],by=p[i1][1],dx=bx-ax,dy=by-ay,L=Math.sqrt(dx*dx+dy*dy);
    for(var i=i0+1;i<i1;i++){
      var d=L?Math.abs(dy*p[i][0]-dx*p[i][1]+bx*ay-by*ax)/L:Math.hypot(p[i][0]-ax,p[i][1]-ay);
      if(d>dm){dm=d;ix=i}
    }
    if(dm>eps&&ix>0){keep[ix]=1;st.push([i0,ix],[ix,i1])}
  }
  return p.filter(function(_,i){return keep[i]});
}
function pack(eps){
  var out=[],n=0;
  strokes.forEach(function(s){
    var q=rdp(s,eps),f=[],lx=null,ly=null;
    q.forEach(function(p){var x=Math.round(p[0]),y=Math.round(p[1]);if(x!==lx||y!==ly){f.push(x,y);lx=x;ly=y}});
    n+=f.length/2;out.push(f);
  });
  return {s:out,n:n};
}
document.getElementById('ok').onclick=function(){
  var tot=0,x0=1e9,y0=1e9,x1=-1,y1=-1;
  strokes.forEach(function(s){tot+=s.length;s.forEach(function(p){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])})});
  if(tot<3){say('Tanda tangan di kotak dulu.');return}
  if((x1-x0)<0.03*W&&(y1-y0)<0.03*H){say('Tanda tangan terlalu kecil.');return}
  var w=T();
  if(!w||!w.sendData){say('Buka halaman ini dari tombol di bot Telegram.');return}
  if(strokes.length>40){say('Terlalu rumit, hapus dan ulangi.');return}
  var eps=[1.5,2,2.5,3,4,5,6,8,10,14,20],str=null;
  for(var i=0;i<eps.length;i++){
    var r=pack(eps[i]);
    if(r.n>1500)continue;
    var s=JSON.stringify({v:1,w:Math.round(W),h:Math.round(H),t:+th.value,s:r.s});
    if(new TextEncoder().encode(s).length<=3800){str=s;break}
  }
  if(!str){say('Terlalu rumit, hapus dan ulangi.');return}
  w.sendData(str);
};
window.addEventListener('resize',size);
size();
})();
</script>
</body>
</html>
